<!doctype html>
<html lang="en" class="live">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Live</title>
  <link rel="stylesheet" href="/_review/viewer.css">
</head>
<body>
  <header>
    <a id="menu" href="/" aria-label="Back to the menu"></a>
    <b id="path"></b>
    <span id="devices" class="seg" role="group" aria-label="Device"></span>
    <span id="size"></span>
    <button id="marking" class="marker" aria-pressed="false" aria-keyshortcuts="m">Mark</button>
  </header>
  <main>
    <div id="screen">
      <iframe id="frame" aria-label="The mockup page"></iframe>
      <div id="layer" hidden>
        <i id="hover" hidden></i>
        <div id="draft" class="box" hidden><i data-corner="nw"></i><i data-corner="ne"></i><i data-corner="sw"></i><i data-corner="se"></i></div>
      </div>
    </div>
  </main>
  <div id="pick" hidden>
    <div id="crumbs" role="group" aria-label="Widen the mark to a parent" hidden></div>
    <span id="found" role="status"></span>
    <button type="button" id="cancel">Cancel</button>
    <button type="button" id="comment" class="go">Comment</button>
  </div>
  <div id="dock">
    <button id="arm" class="marker" aria-pressed="false">Mark</button>
  </div>
  <form id="composer" aria-label="Remark" hidden>
    <textarea id="say" rows="3" placeholder="What is wrong here?"></textarea>
    <div class="row">
      <button type="button" id="discard">Cancel</button>
      <button id="post" class="go" disabled>Post</button>
    </div>
  </form>
  <div id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <i id="spin" hidden></i>
    <a id="open" target="_blank" rel="noopener" hidden>Open</a>
    <button type="button" id="retry" hidden>Retry</button>
    <button type="button" id="dismiss" class="x" aria-label="Dismiss"></button>
  </div>
  <div id="who" hidden>
    <form id="who-form" role="dialog" aria-modal="true" aria-labelledby="who-title">
      <button type="button" id="who-close" class="x" aria-label="Cancel"></button>
      <b id="who-title">What's your name?</b>
      <input id="who-name" name="name" autocomplete="name" autocapitalize="words" required
        aria-label="Your name">
      <button id="continue" class="go" disabled>Continue</button>
    </form>
  </div>
  <script type="module" src="/_review/live.js"></script>
</body>
</html>
