# The whole mockup preview: one container running the /mockup runtime (a pinned Vite dev
# server), bound to loopback on the engine's PREVIEW_PORT_1, which Tailscale proxies to,
# websockets included, so hot reload reaches the phone. The frontend root is mounted
# read-only; shots/ is the one writable mount. PREVIEW_MOCKUP_IMAGE overrides the image,
# e.g. to try a local build of the runtime.
services:
  web:
    image: ${PREVIEW_MOCKUP_IMAGE:-ghcr.io/dantebarba/preview-mockup:0.6.0}
    ports:
      - "127.0.0.1:${PREVIEW_PORT_1}:80"
    environment:
      PREVIEW_ALLOWED_HOSTS: "${PREVIEW_ALLOWED_HOSTS:-}"
    volumes:
      - ..:/app:ro
      - ./shots:/app/.mockup/shots:rw
