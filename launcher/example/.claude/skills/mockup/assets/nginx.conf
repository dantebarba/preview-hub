# Serves a mockup preview: the built sample pages, the generated menu and the gallery.
# A bare "/" is the menu, the reviewer's entry point; "/?v=b" still reaches the built
# app, so pages may live at the root with query variants.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-store" always;

    location = / {
        if ($args = "") { rewrite ^ /_menu/index.html last; }
        try_files /index.html =404;
    }

    location /_menu/ {
        internal;
        alias /usr/share/nginx/menu/;
    }

    location /gallery/ {
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
